<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servlet 前后端联调</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            color: #1f2937;
            background: #f3f4f6;
        }

        main {
            width: min(720px, calc(100% - 32px));
            margin: 48px auto;
            padding: 28px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        p {
            margin: 0 0 24px;
            color: #6b7280;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 16px;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-top: 18px;
        }

        button {
            height: 40px;
            border: 0;
            border-radius: 6px;
            color: #ffffff;
            background: #2563eb;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        pre {
            min-height: 120px;
            margin: 24px 0 0;
            padding: 16px;
            overflow: auto;
            color: #111827;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            white-space: pre-wrap;
        }

        @media (max-width: 640px) {
            main {
                margin: 24px auto;
                padding: 20px;
            }

            .actions {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>
<body>
<main>
    <h1>Servlet 前后端联调</h1>
    <p>输入 name 后点击按钮，请求会发送到对应的后端 Servlet。</p>

    <label for="name">name</label>
    <input id="name" name="name" value="zhangsan" autocomplete="off">

    <div class="actions">
        <button type="button" data-url="user/save">save</button>
        <button type="button" data-url="user/select">select</button>
        <button type="button" data-url="user/update">update</button>
        <button type="button" data-url="user/delete">delete</button>
    </div>

    <pre id="result">等待请求...</pre>
</main>

<script>
    const nameInput = document.querySelector("#name");
    const result = document.querySelector("#result");
    const buttons = document.querySelectorAll("button[data-url]");

    buttons.forEach((button) => {
        button.addEventListener("click", async () => {
            const url = `${button.dataset.url}?name=${encodeURIComponent(nameInput.value)}`;
            result.textContent = `GET ${url}\n请求中...`;

            try {
                const response = await fetch(url);
                const text = await response.text();
                result.textContent = `GET ${url}\n状态码: ${response.status}\n返回结果:\n${text}`;
            } catch (error) {
                result.textContent = `GET ${url}\n请求失败:\n${error.message}`;
            }
        });
    });
</script>
</body>
</html>
